version: '3.8'

services:
  eduscan-db:
    image: postgres:16-alpine
    container_name: eduscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduscan_db
      POSTGRES_USER: ${POSTGRES_USER:-eduscan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en tu .env}
    ports:
      # Expone el puerto 5432 para que tu equipo local pueda conectarse
      - "5432:5432"
    volumes:
      - eduscan_pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - eduscan_net

volumes:
  eduscan_pgdata:
    driver: local

networks:
  eduscan_net:
    driver: bridge
